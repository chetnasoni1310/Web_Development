<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Aguafina+Script&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Inline:opsz,wght@10..72,100..900&display=swap"
      rel="stylesheet"
    />
    <link
    href="https://cdn.jsdelivr.net/npm/remixicon@4.7.0/fonts/remixicon.css"
    rel="stylesheet"
/>
    <link rel="stylesheet" href="../CSS/base.css" />
    <link rel="stylesheet" href="../CSS/loader.css" />
    <link rel="stylesheet" href="../CSS/page1.css" />
  </head>
  <body>
    <div class="loader">
      <div class="loadingLines">
        <div class="line">
          <div class="line1">
            <div class="timer">
              <div class="count">00</div>
              <div class="limit">- 100</div>
            </div>
            <h1>YOUR</h1>
          </div>
        </div>
        <div class="line">
          <h1>WEB EXPERIENCES</h1>
        </div>
        <div id="lastLine" class="line">
          <h1>IS LOADING RIGHT</h1>
          <div class="fontSwitch"><span>NOW</span></div>
        </div>
      </div>
      <div class="waitingRequest">
        <h6>
          Please wait<br />
          a few seconds
        </h6>
      </div>
    </div>
    <div class="main">
      <div class="page1">
        <div class="page1-part1">
          <div class="nav">
            <div class="nav-part1">
              <div class="logo">
                <img src="../assets/icons/gridMenu.png" alt="Grid-Menu" />
              </div>
              <div class="title">
                <h3>Obys</h3>
              </div>
            </div>
            <div class="nav-part2">
              <div class="nav-part2-part1">
                <h3>Obys-</h3>
                <h3>Creative</h3>
                <h3>Design</h3>
                <h3>Agency</h3>
              </div>
              <div class="nav-part2-part2">
                <ul>
                  <li><a href="#">Works</a></li>
                  <li><a href="#">About</a></li>
                  <li><a href="#">Contact</a></li>
                </ul>
              </div>
            </div>
          </div>
          <div class="heading">
            <div class="firstLineOfHeading">
              <div class="pageCount" id="page1Count">01</div>
              <h1>we design</h1>
            </div>
            <h1>unique</h1>
            <h1><span>web</span>/<span>graphic</span></h1>
            <h1>experience</h1>
          </div>
          <div class="scrollElement">
            <h2>Scroll</h2>
          </div>
        </div>
        <div class="page1-part2">
          <div class="videoContainer">
            <video id="page1-video" src="../assets/videos/dior_video.mp4"></video>
            <img id="page1-image" src="../assets/images/glitch.jpg" alt="Glitch Image Dior">
             <div class="playButton" id="playButton1">
              <div class="icon"><i class="ri-play-fill"></i></div>
             </div>
          </div>
        </div>
      </div>

      <div class="page2"></div>
    </div>
  </body>

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"
    integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"
    integrity="sha512-P2IDYZfqSwjcSjX0BKeNhwRUH8zRPGlgcWl5n6gBLzdi4Y5/0O4zaXrtO4K9TZK6Hn1BenYpKowuCavNandERg=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
  <script src="../JS/script.js"></script>
</html>
