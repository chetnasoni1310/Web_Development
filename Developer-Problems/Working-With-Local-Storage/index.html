<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<body>
    <div class="bg-zinc-800 w-full min-h-screen text-white font-[Poppins]">
        <div class="pl-5 userStatus" id="userStatus">
             <h1 class="text-xl pt-10 pb-5 ">Status : <span id="status">Un-Blocked</span></h1>
          <div class="buttons flex gap-10">
             <button class="block bg-red-600 rounded-2xl w-40 px-8 py-2 mt-4 font-semibold text-xl cursor-pointer">Block</button>
               <button class="unblock bg-green-600 rounded-2xl  w-40 px-8 py-2 mt-4 font-semibold text-xl cursor-pointer">Unblock</button>
          </div>
        </div>
    </div>
</body>
